server:
  port: 8000

unique-mall:
  jwt:
    secret-key: ${unique-mall.jwt.secret-key}
    ttl: ${unique-mall.jwt.ttl}
  gateway:
    developer-mode:
      enabled: false
    auth:
      ignore-urls:
        - /api/user/auth/register
        - /api/user/auth/login

spring:
  profiles:
    active: dev
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${unique-mall.nacos.host}:${unique-mall.nacos.port}
      username: ${unique-mall.nacos.username}
      password: ${unique-mall.nacos.password}
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/user/**
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/product/**
            - id: stock-service
              uri: lb://stock-service
              predicates:
                - Path=/api/stock/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/order/**
