server:
  port: 8100

spring:
  profiles:
    active: dev
  application:
    name: user-service
  cloud:
    nacos:
      discovery:
        server-addr: ${unique-mall.nacos.host}:${unique-mall.nacos.port}
      username: ${unique-mall.nacos.username}
      password: ${unique-mall.nacos.password}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${unique-mall.datasource.host}:${unique-mall.datasource.port}/${unique-mall.datasource.database}
    username: ${unique-mall.datasource.username}
    password: ${unique-mall.datasource.password}

unique-mall:
  jwt:
    secret-key: j43iojtoi23j589wfg9hq3u4jrfqj4fj8qo4qijfqoi2
    ttl: 604_800_000
  snowflake:
    datacenter-id: 0
    worker-id: 0

mybatis:
  configuration:
    map-underscore-to-camel-case: true
